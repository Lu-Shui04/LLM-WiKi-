<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的 Agent</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #171b22;
    --panel-2: #1d222b;
    --line: #262c37;
    --text: #e9ecf2;
    --dim: #8a93a3;
    --faint: #5d6674;
    --user: #3b6ff5;
    --user-2: #2557e0;
    --accent: #34d399;
    --accent-2: #1fb894;
    --danger: #ff9b9b;
    --r: 14px;
    --shadow: 0 12px 32px rgba(0, 0, 0, .38);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.75 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶部一圈很淡的绿光，让纯黑背景不至于死板 */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: 380px; pointer-events: none;
    background: radial-gradient(760px 300px at 50% -60px, rgba(52, 211, 153, .09), transparent 70%);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: #2a303b; border-radius: 8px; border: 3px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #39414f; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font: inherit; }

  /* ── 登录页 ───────────────────────────────────── */
  #loginScreen {
    position: relative; min-height: 100%; display: flex;
    align-items: center; justify-content: center; padding: 24px;
  }
  /* display:flex 的优先级高于 [hidden] 的 display:none，必须显式关掉 */
  #loginScreen[hidden] { display: none; }
  .card {
    width: 100%; max-width: 400px; padding: 34px 30px 26px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  }
  .card .mark {
    width: 46px; height: 46px; border-radius: 13px; margin-bottom: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 22px rgba(52, 211, 153, .25);
  }
  .card h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: .3px; }
  .card .hint {
    margin: 0 0 20px; font-size: 13px; color: var(--dim); line-height: 1.95;
  }
  #loginForm { display: flex; flex-direction: column; gap: 10px; }
  #loginForm input {
    width: 100%; padding: 12px 14px; border-radius: 11px;
    background: #10131a; color: var(--text);
    border: 1px solid var(--line); font: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #loginForm input::placeholder { color: var(--faint); }
  #loginForm input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(52, 211, 153, .13);
  }
  #loginForm button {
    margin-top: 4px; padding: 12px; border: 0; border-radius: 11px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #08130f; font-weight: 700; letter-spacing: .5px;
    transition: filter .15s, transform .08s;
  }
  #loginForm button:hover { filter: brightness(1.06); }
  #loginForm button:active { transform: translateY(1px); }
  #loginErr { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--danger); }

  /* ── 聊天页 ───────────────────────────────────── */
  #chatScreen { position: relative; height: 100%; display: flex; flex-direction: column; }
  #chatScreen[hidden] { display: none; }
  header {
    position: sticky; top: 0; z-index: 20; flex: none;
    padding: 12px 18px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 16, 20, .82); backdrop-filter: blur(14px);
  }
  header .brand {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 12px rgba(52, 211, 153, .28);
  }
  header .name { font-weight: 700; letter-spacing: .3px; }
  #who {
    color: var(--accent); font-size: 12px; font-weight: 400;
    border: 1px solid rgba(52, 211, 153, .3); background: rgba(52, 211, 153, .08);
    padding: 1px 9px; border-radius: 999px;
  }
  #who:empty { display: none; }
  #status { font-size: 12px; color: var(--dim); white-space: nowrap; }
  /* 进行中的状态缓慢呼吸，让「正在干活」看得见；完成态回落成灰字，不闪 */
  #status[data-live="1"] { color: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  header .spacer { margin-left: auto; }
  button.ghost {
    background: none; border: 1px solid var(--line); color: var(--dim);
    padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: color .15s, border-color .15s, background .15s;
  }
  button.ghost:hover { color: var(--text); border-color: var(--dim); background: rgba(255, 255, 255, .03); }
  /* 「调试」按下去就是收起态，点亮提醒你：屏幕上现在少了东西 */
  button.ghost.on { color: var(--accent); border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .08); }
  /* 收起时思考块和来源卡片整块隐掉。用 CSS 而不是逐个 DOM 处理，
     后续新流进来的那些也一并盖住 */
  main.lean .think, main.lean .src { display: none; }

  /* 这里**不能**加 scroll-behavior: smooth。跟随的判断是「贴底了吗」，
     而平滑滚动会让容器在好几帧里停在半路——下一帧一问就答「没贴底」，
     于是不跟了；可动画还在往旧目标爬，内容却不停变长，就永远追不上。
     要滚就一步到位。 */
  main { flex: 1; overflow-y: auto; padding: 26px 18px 8px; }
  /* 往上翻的时候才冒出来。流式输出中内容一直在长，靠手滚回底部很难，
     所以必须有这一颗。 */
  #toBottom {
    position: absolute; left: 50%; bottom: 100px; z-index: 15;
    transform: translateX(-50%) translateY(8px);
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .16s, transform .16s, border-color .16s;
  }
  #toBottom.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #toBottom:hover { border-color: var(--dim); }
  .row {
    max-width: 880px; margin: 0 auto 18px;
    display: flex; gap: 11px; align-items: flex-start;
  }
  /* 用户那头把气泡和头像整体推到右边 */
  .row.user { flex-direction: row-reverse; }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 10px; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; user-select: none;
    background: var(--panel-2); color: var(--dim); border: 1px solid var(--line);
  }
  .row.user .avatar { background: linear-gradient(135deg, var(--user), var(--user-2)); color: #fff; border: 0; }
  .row.error .avatar { background: #3b1d1d; color: #ffb4b4; border-color: #7f2b2b; }

  .msg {
    min-width: 0; padding: 12px 15px; border-radius: var(--r);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    background: linear-gradient(135deg, var(--user), var(--user-2));
    border-top-right-radius: 5px; box-shadow: 0 6px 18px rgba(37, 87, 224, .22);
  }
  .msg.assistant {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-top-left-radius: 5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
  }
  .msg.error { background: #3b1d1d; border: 1px solid #7f2b2b; color: #ffb4b4; }

  /* 时间分隔条，微信样式 */
  .stamp { text-align: center; margin: 16px 0 12px; }
  .stamp span {
    font-size: 12px; color: var(--dim);
    background: #22252c; padding: 3px 10px; border-radius: 10px;
  }

  /* 思考块：推理模型先出的那段，立刻显示，正文开始后折叠 */
  .think {
    font-size: 13px; color: var(--dim); white-space: pre-wrap;
    border-left: 2px solid var(--line); padding-left: 10px;
    max-height: 150px; overflow-y: auto; margin-bottom: 10px;
  }
  .think[hidden] { display: none; }
  .think::before {
    content: "思考中…"; display: block;
    font-size: 11px; color: var(--accent); margin-bottom: 4px;
  }
  .think.settled { max-height: 44px; overflow: hidden; cursor: pointer; }
  .think.settled::before { content: "已思考（点击展开）"; color: var(--dim); }
  .think.settled.expanded { max-height: 300px; overflow-y: auto; }

  /* 引用来源：答案上面一行「参考页面」，点开看这一页的原文 */
  .src { margin-bottom: 10px; }
  .src[hidden] { display: none; }
  .src-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .src-label { color: var(--dim); font-size: 12px; margin-right: 2px; }
  .src-chip {
    display: inline-flex; align-items: center; gap: 5px; max-width: 240px;
    background: none; cursor: pointer; font-size: 12px;
    color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px 2px 3px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .src-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-chip .chip-tag {
    flex: none; font-size: 10px; color: var(--faint);
    background: var(--panel-2); border-radius: 999px; padding: 1px 6px;
  }
  .src-chip:hover { color: var(--text); border-color: var(--dim); }
  /* 答完之后点亮的那些：这页真的支撑了这段回答，不只是「读进去了」 */
  .src-chip.on { color: var(--accent); border-color: rgba(52, 211, 153, .5); background: rgba(52, 211, 153, .07); }
  .src-chip.on .chip-tag { color: var(--accent); background: rgba(52, 211, 153, .13); }

  /* 正文按 markdown 渲染。.msg 上那条 pre-wrap 得在这儿关掉，
     不然渲染出来的 <p> 之间会再叠一层换行 */
  .body { white-space: normal; }
  .body p { margin: 0 0 8px; }
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }
  .body h3, .body h4, .body h5, .body h6 {
    margin: 16px 0 8px; font-size: 14px; letter-spacing: .3px;
    color: var(--accent); font-weight: 600;
  }
  .body h5, .body h6 { color: var(--text); font-size: 13px; }
  .body h3::before, .body h4::before, .body h5::before, .body h6::before {
    content: ""; display: inline-block; width: 3px; height: 12px; margin-right: 7px;
    border-radius: 2px; background: var(--accent); vertical-align: -1px;
  }
  .body ul, .body ol { margin: 0 0 8px; padding-left: 22px; }
  .body li { margin: 2px 0; }
  .body strong { color: #fff; font-weight: 600; }
  .body em { color: var(--dim); }
  .body code {
    background: #2a2e37; border-radius: 4px; padding: 1px 5px; font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .body blockquote {
    margin: 0 0 8px; padding: 6px 12px; color: var(--dim); font-size: 13px;
    border-left: 2px solid #3a4250; background: rgba(255, 255, 255, .02);
    border-radius: 0 8px 8px 0;
  }
  /* [[页面名]] 在正文里是个可点的跳转：点了就把那一页的原文调出来 */
  .cite {
    color: var(--accent); cursor: pointer; font-size: 13px;
    border-bottom: 1px dashed rgba(52, 211, 153, .5);
  }
  .cite:hover { background: rgba(52, 211, 153, .1); border-bottom-style: solid; }

  .caret {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── 输入区 ───────────────────────────────────── */
  form#form { flex: none; padding: 12px 18px 18px; }
  .composer {
    max-width: 880px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 8px 8px 8px 6px; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within {
    border-color: rgba(52, 211, 153, .45); box-shadow: 0 12px 32px rgba(0, 0, 0, .38), 0 0 0 3px rgba(52, 211, 153, .09);
  }
  textarea {
    flex: 1; resize: none; height: 40px; max-height: 180px; padding: 9px 4px 9px 12px;
    background: none; color: var(--text); border: 0; font: inherit; outline: none;
  }
  textarea::placeholder { color: var(--faint); }
  #send {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #08130f;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    transition: filter .15s, transform .08s;
  }
  #send:hover:not(:disabled) { filter: brightness(1.08); }
  #send:active:not(:disabled) { transform: scale(.95); }
  #send:disabled { opacity: .4; cursor: not-allowed; }

  /* ── 弹层：看来源页原文 / 翻知识库 ────────────── */
  #modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 22px; }
  #modal[hidden] { display: none; }
  #modal .mask { position: absolute; inset: 0; background: rgba(6, 8, 11, .68); backdrop-filter: blur(3px); }
  .sheet {
    position: relative; width: 100%; max-width: 720px; max-height: 84vh;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .sheet-head {
    flex: none; display: flex; align-items: center; gap: 9px;
    padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .sheet-tag {
    flex: none; font-size: 11px; color: var(--accent);
    border: 1px solid rgba(52, 211, 153, .3); background: rgba(52, 211, 153, .08);
    padding: 1px 8px; border-radius: 999px;
  }
  .sheet-tag:empty { display: none; }
  .sheet-title { margin: 0; font-size: 15px; font-weight: 600; }
  .sheet-path { color: var(--faint); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .sheet-x {
    margin-left: auto; flex: none; background: none; border: 0; cursor: pointer;
    color: var(--dim); font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 7px;
  }
  .sheet-x:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .sheet-body { overflow-y: auto; padding: 18px; }
  .sheet-body .empty { color: var(--dim); font-size: 13px; }

  .kb-group { margin-bottom: 18px; }
  .kb-group h4 {
    margin: 0 0 8px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .8px;
  }
  .kb-item {
    width: 100%; text-align: left; display: block; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 12px; margin-bottom: 7px; color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .kb-item:hover { border-color: rgba(52, 211, 153, .45); background: #20262f; }
  .kb-item .t { font-size: 13px; font-weight: 600; }
  .kb-item .p { font-size: 11px; color: var(--faint); font-family: ui-monospace, Consolas, monospace; }
  .kb-item .s { font-size: 12px; color: var(--dim); margin-top: 3px; }

  @media (max-width: 620px) {
    header { padding: 10px 12px; gap: 7px; }
    header .name { display: none; }
    #status { max-width: 32vw; overflow: hidden; text-overflow: ellipsis; }
    main { padding: 18px 12px 6px; }
    form#form { padding: 10px 12px 14px; }
    .avatar { display: none; }
    .msg { padding: 10px 12px; }
  }
</style>
</head>
<body>

<section id="loginScreen">
  <div class="card">
    <div class="mark"></div>
    <h1>我的 Agent</h1>
    <p class="hint">
      第一次输入的用户名和密码，就是注册。<br />
      以后填同样的用户名 + 密码，就能回到你自己的记忆。<br />
      日常打开浏览器会自动进入，只有换设备或清缓存才需要重填一次。
    </p>
    <form id="loginForm">
      <input id="username" placeholder="用户名" maxlength="32" autocomplete="username" autofocus />
      <input id="password" type="password" placeholder="密码（至少 6 位）" maxlength="64" autocomplete="current-password" />
      <button type="submit">进入</button>
    </form>
    <div id="loginErr"></div>
  </div>
</section>

<section id="chatScreen" hidden>
  <header>
    <span class="brand"></span>
    <span class="name">我的 Agent</span>
    <span id="who"></span> <span id="status">就绪</span>
    <span class="spacer"></span>
    <button class="ghost" id="kb" title="翻看编译好的知识库页面">知识库</button>
    <button class="ghost" id="peek" title="显示思考过程和参考页面。面试时保持关闭。">调试</button>
    <button class="ghost" id="clear">清空</button>
    <button class="ghost" id="logout">退出</button>
  </header>
  <main id="msgs"></main>
  <button id="toBottom" type="button" aria-label="回到最新">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M19 12l-7 7-7-7" />
    </svg>回到最新
  </button>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么… Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" type="submit" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13" /><path d="m12 5 6 7-6 7" />
        </svg>
      </button>
    </div>
  </form>
</section>

<div id="modal" hidden>
  <div class="mask" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <span class="sheet-tag"></span>
      <h2 class="sheet-title"></h2>
      <span class="sheet-path"></span>
      <button class="sheet-x" data-close title="关闭">✕</button>
    </div>
    <div class="sheet-body body"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const msgsEl = $("msgs"), statusEl = $("status"), inputEl = $("input");
const K_TOKEN = "agent.token", K_USER = "agent.username";
const MINUTE_MS = 60_000;
const minuteOf = (ts) => Math.floor(ts / MINUTE_MS);   // 同一分钟内取值相同
let lastSentAt = 0;         // 上一条消息的时间；初值 0 保证首条必插时间条
let sending = false;

// ── 跟着滚，还是别动 ───────────────────────────
// 判断只有一句话：**在内容变长之前**，人是不是本来就贴着底。
// 是 → 跟着滚；不是 → 一个字都不动滚动条，人家往上翻旧内容时不许抢。
// 特意不去用 scroll 事件记状态：那要靠「用户滚的」和「程序滚的」互相区分，
// 中间态一多就误判（实测就栽在这）。直接问「现在贴底吗」，没有状态可失。
const NEAR_BOTTOM = 80;     // 离底这么近就算还在底部，免得差几像素就断了跟随
const bottomGap = () => msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight;
const atBottom = () => bottomGap() <= NEAR_BOTTOM;
const toBottomEl = $("toBottom");
const pinBottom = () => { msgsEl.scrollTop = msgsEl.scrollHeight; };
// 这颗按钮只管提示「下面还有内容」，跟不跟随与它无关
const markBtn = () => toBottomEl.classList.toggle("on", !atBottom());
msgsEl.addEventListener("scroll", markBtn);
toBottomEl.addEventListener("click", () => { pinBottom(); markBtn(); });

// ── 身份 ────────────────────────────────────────
const token = () => localStorage.getItem(K_TOKEN) || "";

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      ...(token() ? { Authorization: `Bearer ${token()}` } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) { leaveChat(); throw new Error("登录已过期，请重新登录"); }
  return res;
}

function enterChat() {
  $("who").textContent = localStorage.getItem(K_USER) || "";
  $("loginScreen").hidden = true;
  $("chatScreen").hidden = false;
}

function leaveChat() {
  localStorage.removeItem(K_TOKEN);
  closeModal();
  $("chatScreen").hidden = true;
  $("loginScreen").hidden = false;
  $("loginErr").textContent = "";
  $("password").value = "";
  $("username").focus();
}

// ── 渲染 ────────────────────────────────────────
function setStatus(text, live = false) {
  statusEl.textContent = text;
  statusEl.dataset.live = live ? "1" : "0";
  console.log(`[status] ${text}`);
}

// 后端每步都会发 stage，但像「组织回答」这种几十毫秒就过去了，一闪根本看不清。
// 所以排个队，每个至少停留 STAGE_MIN_MS；正文/思考一进来就把没播完的清掉，
// 免得「回答中」都开始了，状态还停在「识别意图」。
const STAGE_MIN_MS = 420;
const stageQ = [];
let stageTimer = 0, stageBusy = false;

function setStage(text) {
  stageQ.push(text);
  pumpStage();
}

function pumpStage() {
  if (stageBusy || !stageQ.length) return;
  stageBusy = true;
  setStatus(stageQ.shift(), true);
  stageTimer = setTimeout(() => { stageBusy = false; pumpStage(); }, STAGE_MIN_MS);
}

function clearStages() {
  stageQ.length = 0;
  clearTimeout(stageTimer);
  stageBusy = false;
}

// 一行 = 头像 + 气泡。返回值仍是**气泡**本身，调用方照旧往它里面塞思考块、
// 来源行和正文；要丢掉整行时用 dropRow（气泡的父节点就是那一行）。
function addBubble(role, text = "") {
  const follow = atBottom();      // 先问，再往 DOM 里塞
  const row = document.createElement("div");
  row.className = `row ${role}`;

  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "assistant" ? "AI"
    : role === "user" ? (localStorage.getItem(K_USER) || "我").slice(0, 1)
    : "!";

  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;

  row.append(av, el);
  msgsEl.appendChild(row);
  if (follow) pinBottom();
  return el;
}

// 气泡跑了，头像还杵在那儿——所以整行一起摘
const dropRow = (el) => el.parentElement?.remove();

// 今天只给时刻；早于今天带上月/日，跨年再带上年份
function formatStamp(ts) {
  const pad = (n) => String(n).padStart(2, "0");
  const d = new Date(ts), now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return hm;
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return `昨天 ${hm}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}

function insertStamp(ts) {
  const wrap = document.createElement("div");
  wrap.className = "stamp";
  const pill = document.createElement("span");
  pill.textContent = formatStamp(ts);
  wrap.appendChild(pill);
  msgsEl.appendChild(wrap);
  console.log(`[stamp] ${pill.textContent}`);
}

// 历史回放：时间条规则和实时发送一致（首条必插，之后换分钟才插）
function renderHistory(messages) {
  msgsEl.innerHTML = "";
  pinBottom();              // 回放等于重新开始，先贴底
  lastSentAt = 0;
  for (const m of messages) {
    if (m.role === "user") {
      const ts = Date.parse(m.created_at);
      if (minuteOf(ts) !== minuteOf(lastSentAt)) insertStamp(ts);
      lastSentAt = ts;
      addBubble("user", m.content);
    } else if (m.role === "assistant") {
      // 历史里的回答也走 markdown，不然刷新一下星号又全冒出来了
      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML = mdToHtml(m.content);
      addBubble("assistant").appendChild(body);
    }
  }
}

// ── markdown 渲染 ───────────────────────────────
// 模型爱输出 **粗体** 和 - 列表，页面原来是纯文本写入的，星号就裸在字面上。
// 只认最常用的几种，够用就行——为这个挂个解析库不值当。
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ESC[c]);

function mdInline(s) {
  return s
    // [[页面名]] → 可点的小跳转。放在最前面：它引号里的内容不该再被别的规则改写
    .replace(/\[\[([^\[\]]+)\]\]/g, '<span class="cite" data-page="$1">$1</span>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function mdToHtml(src) {
  let out = "", list = "", kind = "";
  const closeList = () => {
    if (list) { out += `<${kind}>${list}</${kind}>`; list = ""; kind = ""; }
  };
  for (const raw of esc(src).split("\n")) {
    const t = raw.trim();
    if (!t) { closeList(); continue; }

    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const lv = Math.min(h[1].length + 2, 6); out += `<h${lv}>${mdInline(h[2])}</h${lv}>`; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closeList(); out += "<hr />"; continue; }
    // esc 之后引号已经变成 &gt; 了，这里得照着转义后的样子匹配
    const q = t.match(/^&gt;\s?(.*)$/);
    if (q) { closeList(); out += `<blockquote>${mdInline(q[1])}</blockquote>`; continue; }

    const li = t.match(/^([-*+]|\d+[.、])\s+(.*)$/);
    if (li) {
      const k = /^\d/.test(li[1]) ? "ol" : "ul";
      if (kind && kind !== k) closeList();
      kind = k;
      list += `<li>${mdInline(li[2])}</li>`;
      continue;
    }
    closeList();
    out += `<p>${mdInline(t)}</p>`;
  }
  closeList();
  return out;
}

// 模型思考时会念「根据系统提示，问『你叫什么』问的是他」——这话摆在屏幕上就穿帮了。
// 按句丢掉提到提示词的那些，剩下的照常显示。
const PROMPT_TALK = /系统提示|提示词|system ?prompt|我的设定|设定里|指令里/;
const stripPromptTalk = (s) =>
  s.split(/(?<=[。！？；\n])/).filter((seg) => !PROMPT_TALK.test(seg)).join("");

// 逐块写 DOM 会让浏览器每块重排一次，攒到下一帧统一提交。
// 两个元素必须当参数传进来：闭包里再读全局变量的话，下一轮 send 一改写，
// 上一轮挂起的 rAF 就会把文字写进新气泡。
function makePainter(thinkEl, bodyEl) {
  let think = "", thinkAll = "", body = "", bodyAll = "", rafId = 0;
  const flush = () => {
    rafId = 0;
    const follow = atBottom();   // 同样必须赶在这一帧的文字落进 DOM 之前问
    if (think) {
      thinkAll += think; think = "";
      thinkEl.textContent = stripPromptTalk(thinkAll);
    }
    if (body) {
      bodyAll += body; body = "";
      // 每帧重渲染整段：正文撑死几百字，换来流式过程里 ** 就已经是粗体
      bodyEl.innerHTML = mdToHtml(bodyAll) + '<span class="caret"></span>';
    }
    if (follow) { pinBottom(); toBottomEl.classList.remove("on"); }
    else markBtn();              // 不跟随的那一侧，也别让按钮漏出来
  };
  return {
    pushThink(t) { think += t; if (!rafId) rafId = requestAnimationFrame(flush); },
    pushBody(t) { body += t; if (!rafId) rafId = requestAnimationFrame(flush); },
    flushNow() {                      // 收尾时同步落盘，别把最后一块留在 rAF 里
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      flush();
    },
  };
}

// ── 来源行 ──────────────────────────────────────
// 返回 标题→chip 的索引，答完之后按模型真实引用的那几页把它点亮。
function renderSources(bubble, bodyEl, evt) {
  if (!evt.items.length) return null;

  const box = document.createElement("div");
  box.className = "src";
  const line = document.createElement("div");
  line.className = "src-line";

  const label = document.createElement("span");
  label.className = "src-label";
  label.textContent = "参考页面";
  line.appendChild(label);

  const index = new Map();
  for (const it of evt.items) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "src-chip";
    if (it.typeLabel) {
      const tag = document.createElement("i");
      tag.className = "chip-tag";
      tag.textContent = it.typeLabel;
      chip.appendChild(tag);
    }
    const name = document.createElement("span");
    name.textContent = it.title;
    chip.appendChild(name);
    chip.title = `${it.doc}\n点击看这一页的原文`;
    chip.addEventListener("click", () => openPage({ rel: it.rel }));
    line.appendChild(chip);

    index.set(it.title, chip);
    index.set(it.doc, chip);
  }

  box.appendChild(line);
  bubble.insertBefore(box, bodyEl);
  return { index, label };
}

// ── 弹层 ────────────────────────────────────────
// rel / title 二选一：正文里的 [[页面名]] 只有标题，来源 chip 给的是路径。
async function openPage(query) {
  try {
    const res = await api("/api/wiki/page?" + new URLSearchParams(query));
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(typeof body.detail === "string" ? body.detail : `HTTP ${res.status}`);
    }
    const p = await res.json();
    showSheet({
      tag: p.typeLabel,
      title: p.title,
      path: p.doc,
      html: mdToHtml(p.body),
      footer: p.updated ? `最后更新 ${p.updated}` : "",
    });
  } catch (err) {
    setStatus(`这一页打不开：${err.message}`);
    console.warn("[page]", err);
  }
}

async function openIndex() {
  try {
    const res = await api("/api/wiki/pages");
    const data = await res.json();
    if (!data.pages.length) {
      showSheet({ tag: "", title: "知识库", path: "", html: "", empty: "wiki/ 里还没有页面，先跑一次 ingest。" });
      return;
    }
    const groups = new Map();
    for (const p of data.pages) {
      const k = p.typeLabel || "其它";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(p);
    }
    const box = document.createElement("div");
    for (const [label, items] of groups) {
      const g = document.createElement("div");
      g.className = "kb-group";
      const h = document.createElement("h4");
      h.textContent = `${label} · ${items.length}`;
      g.appendChild(h);
      for (const p of items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "kb-item";
        const t = document.createElement("div"); t.className = "t"; t.textContent = p.title;
        const path = document.createElement("div"); path.className = "p"; path.textContent = p.doc;
        btn.append(t, path);
        if (p.summary) {
          const s = document.createElement("div"); s.className = "s"; s.textContent = p.summary;
          btn.appendChild(s);
        }
        btn.addEventListener("click", () => openPage({ rel: p.rel }));
        g.appendChild(btn);
      }
      box.appendChild(g);
    }
    showSheet({ tag: "", title: "知识库", path: `${data.pages.length} 页`, node: box });
  } catch (err) {
    setStatus(`知识库打不开：${err.message}`);
    console.warn("[index]", err);
  }
}

function showSheet({ tag, title, path, html, node, empty, footer }) {
  const sheet = $("modal").querySelector(".sheet");
  sheet.querySelector(".sheet-tag").textContent = tag || "";
  sheet.querySelector(".sheet-title").textContent = title || "";
  sheet.querySelector(".sheet-path").textContent = path || "";
  const bodyEl = sheet.querySelector(".sheet-body");
  bodyEl.replaceChildren();
  if (node) bodyEl.appendChild(node);
  else if (empty) {
    const d = document.createElement("div"); d.className = "empty"; d.textContent = empty;
    bodyEl.appendChild(d);
  } else bodyEl.innerHTML = html || "";
  if (footer) {
    const f = document.createElement("div"); f.className = "src-label"; f.style.marginTop = "14px";
    f.textContent = footer;
    bodyEl.appendChild(f);
  }
  $("modal").hidden = false;
}

function closeModal() { $("modal").hidden = true; }

$("modal").addEventListener("click", (e) => {
  if (e.target.hasAttribute("data-close")) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("modal").hidden) closeModal();
});

// 正文里 **每条消息** 的 [[页面名]] 共用这一个委托监听，不必逐个挂
msgsEl.addEventListener("click", (e) => {
  const cite = e.target.closest?.(".cite");
  if (cite) openPage({ title: cite.dataset.page });
});

// ── 发送 ────────────────────────────────────────
async function send(text) {
  sending = true;
  $("send").disabled = true;
  pinBottom();              // 自己发的消息：先回到底部，这一轮的输出才跟得住

  const now = Date.now();
  if (minuteOf(now) !== minuteOf(lastSentAt)) insertStamp(now);   // 换分钟才插
  lastSentAt = now;

  addBubble("user", text);

  const bubble = addBubble("assistant");
  const thinkEl = document.createElement("div");
  thinkEl.className = "think";
  thinkEl.hidden = true;
  thinkEl.addEventListener("click", () => thinkEl.classList.toggle("expanded"));
  const bodyEl = document.createElement("div");
  bodyEl.className = "body";
  bubble.append(thinkEl, bodyEl);
  const painter = makePainter(thinkEl, bodyEl);

  let thinkLen = 0, bodyLen = 0, chunks = 0, sawThinking = false, src = null;
  setStatus("连接中…", true);

  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ text }) });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);

    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const frames = buffer.split("\n\n");
      buffer = frames.pop();                    // 最后一段可能是半截帧
      for (const frame of frames) {
        const line = frame.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        handle(JSON.parse(line.slice(6)));
      }
    }
  } catch (err) {
    console.error("[error]", err);
    painter.flushNow();
    bodyEl.querySelector(".caret")?.remove();
    dropRow(bubble);
    addBubble("error", String(err.message || err));
    setStatus("出错");
  } finally {
    sending = false;
    $("send").disabled = false;
    inputEl.focus();
  }

  function handle(evt) {
    // stage 走排队显示；其余都是真内容，一进来就把没播完的状态清掉，别盖住实话
    if (evt.type !== "stage") clearStages();

    if (evt.type === "start") {
      console.log(`[start] 模型 ${evt.model}`);
    } else if (evt.type === "stage") {
      setStage(evt.text);
    } else if (evt.type === "sources") {
      src = renderSources(bubble, bodyEl, evt);
    } else if (evt.type === "cited") {
      // 答完才知道引了哪几页。点亮的才是「真的支撑了这段回答」的那几页，
      // 没亮的只是读进去了没用到——这个区别正是它值得单独发一条事件的原因
      if (!src) return;
      let hit = 0;
      for (const t of evt.titles) {
        const chip = src.index.get(t);
        if (chip) { chip.classList.add("on"); hit++; }
      }
      if (hit) src.label.textContent = `引用 ${hit} 页`;
    } else if (evt.type === "thinking") {
      if (!sawThinking) {
        sawThinking = true;
        thinkEl.hidden = false;
        setStatus("思考中…", true);
      }
      thinkLen += evt.text.length;
      painter.pushThink(evt.text);            // 提到「系统提示」的那几句由 painter 丢掉
    } else if (evt.type === "token") {
      if (sawThinking && !thinkEl.classList.contains("settled")) {
        thinkEl.classList.add("settled");     // 正文开始，思考折叠
      }
      bodyLen += evt.text.length;
      chunks++;
      painter.pushBody(evt.text);
      setStatus(`回答中 · ${bodyLen} 字`, true);
    } else if (evt.type === "error") {
      console.error("[error]", evt.message);
      painter.flushNow();
      bodyEl.querySelector(".caret")?.remove();
      dropRow(bubble);
      addBubble("error", evt.message);
      setStatus("出错");
    } else if (evt.type === "done") {
      painter.flushNow();                     // 先把尾块写进 DOM
      bodyEl.querySelector(".caret")?.remove();
      if (sawThinking) thinkEl.classList.add("settled");
      setStatus(`完成 · 思考 ${thinkLen} 字 / 正文 ${bodyLen} 字 / ${chunks} 块`);
    }
  }
}

// ── 事件绑定 ────────────────────────────────────
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username) return;
  if (password.length < 6) { $("loginErr").textContent = "密码至少 6 位"; return; }
  $("loginErr").textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      // 校验失败时 FastAPI 的 detail 是数组，不能直接塞进 textContent
      $("loginErr").textContent =
        typeof body.detail === "string" ? body.detail : `登录失败 HTTP ${res.status}`;
      return;
    }
    const data = await res.json();
    localStorage.setItem(K_TOKEN, data.session_token);
    localStorage.setItem(K_USER, data.username);
    $("password").value = "";
    await loadHistory(data.is_new_user ? "注册成功，开始聊吧" : "欢迎回来");
  } catch (err) {
    $("loginErr").textContent = String(err.message || err);
  }
});

async function loadHistory(greeting) {
  enterChat();
  try {
    const res = await api("/api/history");
    const data = await res.json();
    renderHistory(data.messages);
    setStatus(`${greeting} · 历史 ${data.messages.length} 条`);
  } catch (err) {
    console.error("[history]", err);
    setStatus("历史载入失败");
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || sending) return;
  inputEl.value = "";
  autoGrow();
  send(text);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

// 输入框随内容长高，到 180px 封顶后自己出滚动条
function autoGrow() {
  inputEl.style.height = "40px";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
}
inputEl.addEventListener("input", autoGrow);

// 思考过程、知识库来源、进度阶段都照常显示——那正是这个 Agent 拿得出手的东西，藏了反而没得看。
// 「调试」留着做反向开关：真到面试官凑过来看屏幕，一键把思考块和来源卡片收掉。
let debugView = true;
$("peek").classList.add("on");
$("peek").addEventListener("click", () => {
  debugView = !debugView;
  $("peek").classList.toggle("on", debugView);
  msgsEl.classList.toggle("lean", !debugView);   // 后续新流进来的也一并盖住
  setStatus(debugView ? "完整视图" : "已收起思考与来源");
});

$("kb").addEventListener("click", openIndex);

$("clear").addEventListener("click", async () => {
  msgsEl.innerHTML = "";
  lastSentAt = 0;
  setStatus("正在清空…", true);
  try {
    await api("/api/history", { method: "DELETE" });
    setStatus("已清空，从头开始聊");
  } catch (err) {
    // 服务端没清掉必须说出来：界面空着、上下文还在，下一轮回答会莫名其妙
    setStatus("清空失败，历史还在服务端");
    console.error("[clear]", err);
  }
});

$("logout").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch (err) { console.warn(err); }
  msgsEl.innerHTML = "";
  lastSentAt = 0;
  leaveChat();
});

// ── 启动 ────────────────────────────────────────
(async () => {
  if (!token()) { $("username").focus(); return; }
  await loadHistory("欢迎回来");
})();
</script>
